<!-- The console's brand mark: the same rising line as the sidebar logo, on the
     same blue-to-teal gradient. Drawn heavy and with generous padding because a
     favicon is read at 16px — fine detail there turns into mush. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#2bd4bd"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <path d="M4 20.6l6.7-10.6 5.3 6.6 4-5.3 8 9.3"
        fill="none" stroke="#fff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
