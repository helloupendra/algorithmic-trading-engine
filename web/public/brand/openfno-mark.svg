<!-- OpenFNO mark: an option chain — calls on the left, puts on the right, the
     ATM row the longest, the strike ladder down the middle. Drawn heavy: it is
     read at 16px in a tab as often as at 128px on a page. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><defs><linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4f7dff"/><stop offset="1" stop-color="#2bd4bd"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><g fill="#fff"><rect x="14" y="17.5" width="12" height="6" rx="3"/><rect x="38" y="17.5" width="12" height="6" rx="3"/><rect x="8" y="28.5" width="18" height="7" rx="3.5"/><rect x="38" y="28.5" width="18" height="7" rx="3.5"/><rect x="14" y="40.5" width="12" height="6" rx="3"/><rect x="38" y="40.5" width="12" height="6" rx="3"/></g><rect x="30.75" y="13" width="2.5" height="38" rx="1.25" fill="#fff" opacity=".9"/></svg>
