<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The brand mark, not an emoji: a 90px glyph in a 100px box rendered as a
         clipped blob in the tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout reach under the notch and the home
         indicator, which is what makes env(safe-area-inset-*) return anything
         other than zero on an iPhone. The CSS pads those edges back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The console is dark; without this iOS paints white behind rubber-band
         scrolling and around the status bar. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070b11" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OpenFNO</title>
    <meta name="description" content="Open-source algorithmic trading for Indian F&O: live paper runs on real ticks, coverage-first backtests, a position-based view of every trade." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenFNO — open-source algo trading for Indian F&O" />
    <meta property="og:description" content="Live paper runs on real ticks, coverage-first backtests, and a position-based view of every trade. Self-hosted, on your own broker keys." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
