<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- The brand mark, not an emoji: a 90px glyph in a 100px box rendered as a
         clipped blob in the tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout reach under the notch and the home
         indicator, which is what makes env(safe-area-inset-*) return anything
         other than zero on an iPhone. The CSS pads those edges back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Both themes; without this iOS paints the wrong ground behind
         rubber-band scrolling and around the status bar. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#f6f8f9" />
    <!-- The theme before the first paint (light | dark | system, default
         light): public/theme-boot.js, a file because the API's CSP refuses
         inline scripts. Blocking on purpose; it is a few hundred bytes. -->
    <script src="/theme-boot.js"></script>
    <!-- iOS reads this in preference to the manifest's icons, so the 180px file
         is what actually lands on the home screen; the manifest set is for
         everyone else. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installed, the console opens on /login: "/" is the marketing page, and
         /login is the one route that knows where to send you — it bounces a
         signed-in user to /admin or /trader and shows the form to everyone
         else. The manifest's scope stays "/" so signing out (which navigates
         home) does not fall out of the app and into Safari. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Belt and braces. iOS 16.4+ opens a standalone window off the manifest's
         display member alone, but this is the mechanism that still works on
         older iPhones — and Apple's status bar style below is documented as
         having no effect without it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": translucent hands the status bar's
         height to the page, and the console's topbar has no top inset to give
         it, so the clock would sit on the health chips. Default follows the
         theme-color the script above keeps in step, so a light console does not
         get a black strip. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Without this iOS offers the <title> below as the home-screen name, and
         the SEO title is a sentence. -->
    <meta name="apple-mobile-web-app-title" content="OpenFNO" />
    <!-- The console's shell. "/" is the static homepage (home.html), which
         carries the description, the cards and the structured data; every
         page served this file is behind a sign-in and not for indexing. -->
    <title>OpenFNO</title>
    <meta name="robots" content="noindex,nofollow" />

  </head>
  <body>
    <!-- The first paint, before any JavaScript has parsed: the same candles the
         app shows while it loads (components/CandleLoader). React replaces the
         contents of #root on mount, so this needs no teardown. -->
    <style>
      /* The console's ground (--bg0): dark here, light in the rules below. */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0e1115; }
      #boot .b { display: flex; align-items: flex-end; gap: 7px; height: 64px; }
      #boot .b span { display: block; width: 10px; border-radius: 2px; transform-origin: bottom; animation: bootc 1.9s cubic-bezier(.45,0,.3,1) infinite; }
      #boot .b span:nth-child(odd) { background: #25d69a; }
      #boot .b span:nth-child(even) { background: #ff5f5c; }
      #boot .b span:nth-child(1) { height: 34%; animation-delay: 0s }
      #boot .b span:nth-child(2) { height: 58%; animation-delay: .12s }
      #boot .b span:nth-child(3) { height: 46%; animation-delay: .24s }
      #boot .b span:nth-child(4) { height: 72%; animation-delay: .36s }
      #boot .b span:nth-child(5) { height: 40%; animation-delay: .48s }
      #boot .b span:nth-child(6) { height: 64%; animation-delay: .6s }
      #boot .b span:nth-child(7) { height: 50%; animation-delay: .72s }
      #boot .b span:nth-child(8) { height: 78%; animation-delay: .84s }
      #boot .b span:nth-child(9) { height: 44%; animation-delay: .96s }
      /* The label waits 400ms so a fast load never flashes it. */
      #boot p { margin: 22px 0 0; font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; color: rgba(233,238,250,.42); text-align: center; animation: bootp .01s .4s both; }
      @keyframes bootp { from { opacity: 0 } to { opacity: 1 } }
      @keyframes bootc { 0% { transform: scaleY(.25); opacity: .35 } 35% { transform: scaleY(1); opacity: 1 } 70% { transform: scaleY(.62); opacity: .85 } 100% { transform: scaleY(.25); opacity: .35 } }
      @media (prefers-reduced-motion: reduce) { #boot .b span { animation: none } }
      :root[data-theme='light'] #boot { background: #f6f8f9; }
      :root[data-theme='light'] #boot p { color: rgba(34,38,58,.5); }
      :root[data-theme='light'] #boot .b span:nth-child(odd) { background: #127a52; }
      :root[data-theme='light'] #boot .b span:nth-child(even) { background: #bf3446; }
    </style>
    <div id="root"><div id="boot"><div><div class="b"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><p>Loading the console</p></div></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
