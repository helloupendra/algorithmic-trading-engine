name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the "runs on any OS" claim rather than just asserting it.
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AlgoTrading.slnx

      - name: Build
        run: dotnet build AlgoTrading.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AlgoTrading.slnx --no-build --configuration Release --verbosity normal

  python:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/AlgoTrading.PythonEngine/requirements.txt

      - name: Byte-compile the engine
        run: python -m compileall -q src/AlgoTrading.PythonEngine scripts

      # The suite that actually covers the risk rules, the ledger, the strike
      # arithmetic and the feed watchdog. CI byte-compiled the engine and stopped
      # there, so it was green whatever those tests said.
      - name: Run the engine test suite
        working-directory: src/AlgoTrading.PythonEngine
        run: python -m unittest discover -s tests -t tests -v

      - name: Verify the settings generator
        run: |
          cp .env.example .env
          python scripts/_gen_local_settings.py --quiet
          test -f src/AlgoTrading.Api/appsettings.Local.json
          test -f src/AlgoTrading.Worker.MarketData/appsettings.Local.json

  scripts:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/load-data.sh
          bash -n scripts/desk.sh
          bash -n scripts/market-open.sh
          bash -n scripts/market-close.sh

      # The desk's own decisions — the deploy gate, the morning FYERS gate —
      # are plain bash with their clock and API stubbed, so they run here.
      - name: Script tests
        run: |
          for t in scripts/tests/*.test.sh; do
            echo "== $t"
            bash "$t"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: warning

  # The console: its type check, lint, unit tests (web/src/lib) and production build, which also
  # builds the docs site from docs/*.md. Until 3 Oct none of this ran here, only on a developer's machine.
  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (console and docs site)
        run: npx vite build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a tracked file carries a credential
        run: |
          # Tracked appsettings must never hold a real value.
          if git grep -nE '"(SecretKey|ClientId)"\s*:\s*"[A-Za-z0-9]{6,}"' -- \
               '*appsettings.json' | grep -v 'REPLACE_THIS'; then
            echo "::error::A credential appears to be committed in an appsettings.json"
            exit 1
          fi
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          echo "No committed credentials found."
