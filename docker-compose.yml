# AlgoTrading local infrastructure.
#
# Lives at the repo root so `docker compose` picks up the sibling `.env`
# automatically. Run everything with:
#
#   docker compose up -d
#
# Config files for Prometheus and Grafana stay under ./docker.
#
# Every credential below comes from `.env` (see `.env.example`). The `:?` form
# makes compose refuse to start with a clear error rather than silently booting
# with a blank password.

name: algotrading

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: algotrading_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set — copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-algotrading}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      # Lets `docker compose up --wait` and the setup scripts block until
      # Postgres genuinely accepts connections, instead of guessing with sleep.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: algotrading_redis
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: algotrading_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Lets Prometheus scrape the .NET API/workers running natively on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: algotrading_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    restart: unless-stopped

  # Optional Redis GUI. Not started by default:
  #   docker compose --profile tools up -d
  redisinsight:
    image: redis/redisinsight:latest
    container_name: algotrading_redisinsight
    profiles: ["tools"]
    ports:
      - "8001:5540"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
  prometheus_data:
  grafana_data:
